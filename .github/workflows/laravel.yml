name: Laravel

on:

  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

#  schedule:
#    - cron: '0 0 * * *'

jobs:
  laravel-analyse:

    runs-on: ubuntu-latest

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: composer install --dev --optimize-autoloader --no-progress --no-interaction --prefer-dist

      - name: Copy .env file
        run: |
          cp .env.ci .env
          php artisan key:generate
          cp .env .env.testing

      - name: Directory Permissions
        run: chmod -R 777 ./storage ./bootstrap/cache

      - name: Run Rector
        run: |
          composer rector

      - name: Run Pint
        run: |
          composer pint

      - name: Run Larastan
        run: |
          composer phpstan

      - name: Run tests
        run: |
          composer test
        env:
          DB_DATABASE: cicd_testing

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: cicd_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=3
